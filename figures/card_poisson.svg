  <text x="199" y="76" font-size="9" fill="#4A4A6A" font-weight="bold" text-anchor="start" font-family="sans-serif">PMF</text>
  <text x="247" y="76" font-size="10.5" fill="#1A1A2E" font-family="Courier New,monospace">P(K=k) = e^(-λ) λ^k / k!</text>
