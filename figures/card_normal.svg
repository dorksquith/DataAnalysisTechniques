<svg xmlns="http://www.w3.org/2000/svg" width="760" height="185" viewBox="0 0 760 185">
  <rect width="760" height="185" rx="10" ry="10" fill="#F9FAFB" stroke="#D8DDE6" stroke-width="1.5"/>
  <clipPath id="lp"><rect width="185" height="185" rx="10" ry="10"/></clipPath>
  <rect width="185" height="185" fill="#C05720" clip-path="url(#lp)"/>
  <rect x="175" width="10" height="185" fill="#C05720"/>
  <line x1="185" y1="0" x2="185" y2="185" stroke="#D8DDE6" stroke-width="1.5"/>
  <text x="92" y="175" font-size="9" fill="white" font-weight="bold" text-anchor="middle" font-family="sans-serif">CONTINUOUS</text>
  <line x1="8" y1="118" x2="177" y2="118" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <path d="M 12,118 C 42,118 42,33 92,28 C 142,33 143,118 173,118 Z" fill="white" opacity="0.18"/>
  <line x1="92" y1="24" x2="92" y2="118" stroke="white" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>
  <path d="M 12,118 C 42,118 42,33 92,28 C 142,33 143,118 173,118" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="92" y1="130" x2="130" y2="130" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <text x="111" y="142" font-size="10" fill="white" font-weight="normal" text-anchor="middle" font-family="sans-serif" font-style="italic">σ</text>
  <text x="92" y="155" font-size="14" fill="white" font-weight="bold" text-anchor="middle" font-family="sans-serif">Normal</text>
  <text x="199" y="20" font-size="9" fill="#C05720" font-weight="bold" text-anchor="start" font-family="sans-serif">USE WHEN</text>
  <text x="199" y="36" font-size="11" fill="#1A1A2E" font-weight="normal" text-anchor="start" font-family="sans-serif">Symmetric variation around a mean; arises by the Central Limit Theorem.</text>
  <line x1="199" y1="62" x2="746" y2="62" stroke="#D8DDE6" stroke-width="1"/>
  <text x="199" y="76" font-size="9" fill="#4A4A6A" font-weight="bold" text-anchor="start" font-family="sans-serif">PDF</text>
  <text x="247" y="76" font-size="10.5" fill="#1A1A2E" font-family="Courier New,monospace">f(x) = (1/σ√2π) exp[-(x-μ)²/2σ²]</text>
  <line x1="199" y1="95" x2="746" y2="95" stroke="#D8DDE6" stroke-width="1"/>
  <text x="199" y="109" font-size="9" fill="#4A4A6A" font-weight="bold" text-anchor="start" font-family="sans-serif">Params:</text>
  <text x="249" y="109" font-size="10" fill="#1A1A2E" font-weight="normal" text-anchor="start" font-family="sans-serif">μ ∈ ℝ, σ &gt; 0</text>
  <text x="482" y="109" font-size="9" fill="#4A4A6A" font-weight="bold" text-anchor="start" font-family="sans-serif">Support:</text>
  <text x="534" y="109" font-size="10" fill="#1A1A2E" font-weight="normal" text-anchor="start" font-family="sans-serif">x ∈ ℝ</text>
  <text x="199" y="125" font-size="10" fill="#1A1A2E" font-weight="normal" text-anchor="start" font-family="sans-serif">E[X] = μ     Var[X] = σ²</text>
  <rect x="656" y="8" width="90" height="18" rx="4" fill="#C05720" opacity="0.12"/>
  <text x="701" y="21" font-size="9" fill="#C05720" font-weight="bold" text-anchor="middle" font-family="sans-serif">CONTINUOUS</text>
</svg>